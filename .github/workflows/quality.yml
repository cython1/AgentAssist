name: Quality Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Prettier, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify lint
        run: npm run lint:verify

      - name: Verify Prettier
        run: npm run prettier:verify

      - name: Build
        run: npm run build
